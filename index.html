<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Flávio Já Fugiu?</title>
<meta name="description" content="Contagem regressiva para a saída do Flávio do Brasil.">
<meta property="og:title" content="O Flávio Já Fugiu?">
<meta property="og:description" content="Contagem regressiva oficial. Acompanhe ao vivo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23009C3B'/><polygon points='50,14 88,50 50,86 12,50' fill='%23FFDF00'/><circle cx='50' cy='50' r='18' fill='%23002776'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     CONFIGURAÇÃO — edite só aqui (no <script> lá embaixo)
     ========================================================= */
  :root {
    --verde: #009C3B;
    --verde-escuro: #00702A;
    --amarelo: #FFDF00;
    --azul: #002776;
    --azul-claro: #1E4FB8;
    --branco: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--branco);
    background: var(--verde);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,223,0,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,39,118,.35), transparent 45%),
      linear-gradient(160deg, var(--verde) 0%, var(--verde-escuro) 100%);
    overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Losango amarelo de fundo */
  .losango {
    position: fixed; top: 50%; left: 50%;
    width: min(120vw, 1100px); aspect-ratio: 1.5 / 1;
    transform: translate(-50%, -50%);
    background: var(--amarelo);
    clip-path: polygon(50% 4%, 97% 50%, 50% 96%, 3% 50%);
    opacity: .12; z-index: 0; pointer-events: none;
  }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 920px;
    padding: 56px 16px 32px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .selo {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px);
    padding: 8px 16px; border-radius: 999px;
    font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  }
  .selo .pulso {
    width: 8px; height: 8px; border-radius: 50%; background: var(--amarelo);
    box-shadow: 0 0 0 0 rgba(255,223,0,.7); animation: pulso 1.6s infinite;
  }
  @keyframes pulso { 70% { box-shadow: 0 0 0 10px rgba(255,223,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,223,0,0); } }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.4rem, 8vw, 5.2rem);
    line-height: 1; margin: 24px 0 8px;
    letter-spacing: -.02em;
    text-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  h1 .destaque { color: var(--amarelo); }

  /* Globo azul com a resposta */
  .globo {
    position: relative; margin: 28px 0;
    width: clamp(200px, 46vw, 300px); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--azul-claro), var(--azul) 65%);
    box-shadow: 0 0 0 10px var(--amarelo), 0 20px 50px rgba(0,0,0,.35);
    display: grid; place-items: center; overflow: hidden;
  }
  .globo::before { /* faixa branca */
    content: ""; position: absolute; left: -10%; right: -10%; top: 46%;
    height: 16%; background: var(--branco);
    transform: rotate(-12deg); border-radius: 50%;
  }
  .globo .resposta {
    position: relative; z-index: 1;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    color: var(--azul);
    background: var(--branco);
    padding: 4px 14px; border-radius: 10px;
    transform: rotate(-12deg);
  }
  .globo .estrela { position: absolute; width: 6px; height: 6px; background: var(--branco); border-radius: 50%; opacity: .9; }

  .sub { font-size: clamp(1rem, 2.4vw, 1.2rem); opacity: .92; max-width: 560px; }
  .sub strong { color: var(--amarelo); }

  /* Contagem */
  .contagem {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    width: 100%; max-width: 680px; margin: 32px 0 12px;
  }
  .bloco {
    background: var(--branco); color: var(--azul);
    border-radius: 18px; padding: 18px 6px 14px;
    box-shadow: 0 8px 0 var(--amarelo), 0 18px 40px rgba(0,0,0,.25);
  }
  .bloco.principal { background: var(--azul); color: var(--branco); box-shadow: 0 8px 0 var(--amarelo), 0 18px 40px rgba(0,0,0,.3); }
  .num { font-family: 'Archivo Black', sans-serif; font-size: clamp(1.8rem, 7vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
  .rot { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-top: 8px; opacity: .75; }

  .data-alvo { margin-top: 18px; font-size: .9rem; opacity: .8; }

  /* Barra de progresso */
  .progresso { width: 100%; max-width: 680px; margin-top: 22px; }
  .trilho { height: 12px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; }
  .barra { height: 100%; width: 0; background: linear-gradient(90deg, var(--amarelo), var(--branco)); border-radius: 999px; transition: width 1s ease; }
  .progresso small { display: block; margin-top: 8px; font-size: .8rem; opacity: .8; }

  /* Estado: FUGIU */
  .comemoracao { display: none; flex-direction: column; align-items: center; gap: 20px; margin-top: 12px; }
  body.fugiu .comemoracao { display: flex; }
  body.fugiu .contagem, body.fugiu .progresso, body.fugiu .data-alvo { display: none; }
  body.fugiu .globo .resposta { background: var(--amarelo); }
  .comemoracao img {
    width: 100%; max-width: 560px; border-radius: 20px;
    border: 6px solid var(--branco); box-shadow: 0 0 0 6px var(--amarelo), 0 20px 50px rgba(0,0,0,.35);
  }
  .comemoracao .titulo-festa {
    font-family: 'Archivo Black', sans-serif; font-size: clamp(1.6rem, 5vw, 2.6rem); color: var(--amarelo);
  }
  .banner-festa {
    width: 100%; max-width: 560px; aspect-ratio: 16/10; border-radius: 20px;
    background: var(--azul); display: grid; place-items: center; font-size: clamp(4rem, 14vw, 7rem);
    box-shadow: 0 0 0 6px var(--amarelo), 0 20px 50px rgba(0,0,0,.35);
  }

  /* Confete */
  .confete { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 5; pointer-events: none; animation: cair linear forwards; }
  @keyframes cair { to { transform: translateY(110vh) rotate(720deg); } }

  footer { position: relative; z-index: 1; padding: 28px 16px 36px; font-size: .8rem; opacity: .75; text-align: center; }
  footer .faixa { display: inline-flex; height: 6px; width: 120px; border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  footer .faixa span { flex: 1; }

  @media (max-width: 520px) {
    .contagem { gap: 8px; }
    .bloco { border-radius: 14px; padding: 14px 4px 10px; }
    .rot { font-size: .6rem; letter-spacing: .08em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .selo .pulso, .confete { animation: none; }
  }
</style>
</head>
<body>
  <div class="losango" aria-hidden="true"></div>

  <main>
    <span class="selo"><span class="pulso"></span> Acompanhamento ao vivo</span>

    <h1>O Flávio<br><span class="destaque">Já Fugiu?</span></h1>

    <div class="globo" aria-live="polite">
      <span class="estrela" style="top:22%;left:30%"></span>
      <span class="estrela" style="top:30%;left:62%"></span>
      <span class="estrela" style="top:70%;left:40%"></span>
      <span class="estrela" style="top:76%;left:66%"></span>
      <span class="estrela" style="top:18%;left:50%"></span>
      <span class="resposta" id="resposta">AINDA NÃO</span>
    </div>

    <p class="sub" id="sub">Faltam <strong id="sub-dias">—</strong> dias para a saída do Flávio do Brasil.</p>

    <section class="contagem" aria-label="Contagem regressiva">
      <div class="bloco principal"><div class="num" id="dias">0</div><div class="rot">Dias</div></div>
      <div class="bloco"><div class="num" id="horas">00</div><div class="rot">Horas</div></div>
      <div class="bloco"><div class="num" id="minutos">00</div><div class="rot">Minutos</div></div>
      <div class="bloco"><div class="num" id="segundos">00</div><div class="rot">Segundos</div></div>
    </section>

    <div class="progresso">
      <div class="trilho"><div class="barra" id="barra"></div></div>
      <small id="pct">—</small>
    </div>

    <p class="data-alvo" id="data-alvo"></p>

    <section class="comemoracao" aria-label="Comemoração">
      <div class="titulo-festa">🇧🇷 SIM! ELE FUGIU! 🎉</div>
      <!-- A imagem aparece se existir; senão mostra o banner de emoji -->
      <img id="img-festa" alt="Comemoração" hidden>
      <div class="banner-festa" id="banner-festa">🎉🥳🎊</div>
      <p class="sub" id="desde"></p>
    </section>
  </main>

  <footer>
    <div class="faixa"><span style="background:var(--verde)"></span><span style="background:var(--amarelo)"></span><span style="background:var(--azul)"></span><span style="background:var(--branco)"></span></div>
    <div>Site de humor. Ordem e Progresso. ✈️</div>
  </footer>

<script>
  /* =========================================================
     CONFIGURAÇÃO — edite estes valores
     ========================================================= */
  const CONFIG = {
    // Data/hora prevista da saída (fuso de Brasília, -03:00)
    dataSaida: "2026-12-31T23:59:59-03:00",

    // Data de início da contagem (usada só na barra de progresso)
    dataInicio: "2026-10-26T00:00:00-03:00",

    // Mude para true quando ele sair de verdade (mesmo antes da data)
    jaFugiu: false,

    // Imagem de comemoração (coloque o arquivo na mesma pasta do index.html)
    imagemComemoracao: "comemoracao.jpg"
  };
  /* ========================================================= */

  const alvo = new Date(CONFIG.dataSaida).getTime();
  const inicio = new Date(CONFIG.dataInicio).getTime();
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  $("data-alvo").textContent = "Data prevista: " + new Date(alvo).toLocaleString("pt-BR", {
    dateStyle: "full", timeStyle: "short", timeZone: "America/Sao_Paulo"
  });

  let comemorando = false;

  function comemorar() {
    if (comemorando) return;
    comemorando = true;
    document.body.classList.add("fugiu");
    $("resposta").textContent = "SIM!";
    $("sub").innerHTML = "Ele <strong>finalmente</strong> saiu do Brasil.";
    document.title = "SIM! O Flávio Já Fugiu! 🎉";

    const img = $("img-festa");
    img.onload = () => { img.hidden = false; $("banner-festa").style.display = "none"; };
    img.src = CONFIG.imagemComemoracao;

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) chuvaDeConfete();
  }

  function chuvaDeConfete() {
    const cores = ["#009C3B", "#FFDF00", "#002776", "#FFFFFF"];
    let n = 0;
    const timer = setInterval(() => {
      for (let i = 0; i < 6; i++) {
        const c = document.createElement("div");
        c.className = "confete";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = cores[Math.floor(Math.random() * cores.length)];
        c.style.animationDuration = 3 + Math.random() * 3 + "s";
        c.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6500);
      }
      if (++n > 60) clearInterval(timer);
    }, 120);
  }

  function atualizar() {
    const agora = Date.now();
    const resta = alvo - agora;

    if (CONFIG.jaFugiu || resta <= 0) {
      comemorar();
      const passou = Math.floor(Math.max(0, agora - alvo) / 86400000);
      $("desde").textContent = CONFIG.jaFugiu && resta > 0
        ? "Saiu antes do previsto! 🏃‍♂️💨"
        : (passou === 0 ? "Aconteceu hoje!" : `Já faz ${passou} dia${passou > 1 ? "s" : ""}.`);
      return;
    }

    const d = Math.floor(resta / 86400000);
    const h = Math.floor(resta / 3600000) % 24;
    const m = Math.floor(resta / 60000) % 60;
    const s = Math.floor(resta / 1000) % 60;
    $("dias").textContent = d;
    $("horas").textContent = pad(h);
    $("minutos").textContent = pad(m);
    $("segundos").textContent = pad(s);
    $("sub-dias").textContent = d;

    const total = alvo - inicio;
    const pct = total > 0 ? Math.min(100, Math.max(0, ((agora - inicio) / total) * 100)) : 0;
    $("barra").style.width = pct.toFixed(1) + "%";
    $("pct").textContent = pct.toFixed(1) + "% do caminho até o aeroporto ✈️";
  }

  atualizar();
  setInterval(atualizar, 1000);
</script>
</body>
</html>
